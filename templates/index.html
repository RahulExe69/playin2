<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Creator</title>
    <style>
        :root {
            --primary: #a29bfe;
            --secondary: #00cec9;
            --background: #121212;
            --card: #1e1e1e;
            --input-bg: #2c2c2c;
            --text: #f1f1f1;
            --success: #00b894;
            --error: #ff7675;
        }

        body {
            margin: 0;
            padding: 1rem;
            background: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            color: var(--primary);
            text-align: center;
        }

        form {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            max-width: 500px;
            margin: 1rem auto;
        }

        label {
            display: block;
            margin: 1rem 0 0.5rem;
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #444;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            width: 100%;
            margin-top: 1rem;
            cursor: pointer;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .error {
            background: #2e1e1e;
            color: var(--error);
            border-left: 4px solid var(--error);
        }

        .success {
            background: #1e2e1e;
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        #status-panel {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            max-width: 500px;
            margin: 1rem auto;
        }
    </style>
</head>
<body>
    <h1>Auto Account Creator</h1>
    
    {% if error %}
    <div class="message error">{{ error }}</div>
    {% endif %}
    
    {% if success %}
    <div class="message success">{{ success }}</div>
    {% endif %}

    <form method="POST">
        <label>Base Username:</label>
        <input type="text" name="base_username" required>
        
        <label>Password:</label>
        <input type="password" name="password" required>
        
        <label>Number of Accounts:</label>
        <input type="number" name="count" min="1" required>
        
        <label>Custom Phone (optional):</label>
        <input type="text" name="phone" pattern="\d{10}">
        
        <button type="submit">Start Creation</button>
    </form>

    <div id="status-panel">
        <h2>Live Status</h2>
        <div>Total: <span id="total">0</span></div>
        <div>Created: <span id="created">0</span></div>
        <div>Success: <span id="success">0</span></div>
        <div>Failure: <span id="failure">0</span></div>
        <div>Running: <span id="running">No</span></div>
    </div>

    <script>
        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                document.getElementById('total').textContent = data.total;
                document.getElementById('created').textContent = data.current;
                document.getElementById('success').textContent = data.success;
                document.getElementById('failure').textContent = data.failure;
                document.getElementById('running').textContent = data.running ? "Yes" : "No";
            } catch (error) {
                console.error('Status update failed:', error);
            }
        }
        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
