<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Creator</title>
    <style>
    :root {
        --primary: #a29bfe;
        --secondary: #00cec9;
        --background: #121212;
        --card: #1e1e1e;
        --input-bg: #2c2c2c;
        --text: #f1f1f1;
        --success: #00b894;
        --error: #ff7675;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 1rem;
        background: var(--background);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.8s ease-in;
    }

    h1, h2 {
        color: var(--primary);
        margin-top: 1.2rem;
        text-align: center;
        font-size: 1.6rem;
    }

    form, #status-panel {
        background: var(--card);
        padding: 1.2rem;
        margin-top: 1.2rem;
        border-radius: 14px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        animation: floatUp 0.5s ease-out;
    }

    label {
        display: block;
        margin: 1rem 0 0.3rem;
        color: var(--primary);
        font-size: 0.95rem;
        font-weight: 500;
    }

    input {
        padding: 0.75rem;
        width: 100%;
        border: 1px solid #444;
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 1rem;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 8px rgba(0, 206, 201, 0.3);
    }

    button {
        padding: 0.9rem 1.4rem;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        margin-top: 1.5rem;
        width: 100%;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s;
    }

    button:hover {
        background: #6c5ce7;
        transform: scale(1.02);
    }

    .message {
        margin: 1rem 0;
        padding: 0.9rem;
        border-radius: 10px;
        font-weight: bold;
        font-size: 0.95rem;
        animation: fadeIn 0.4s ease-in;
    }

    .error {
        background: #2e1e1e;
        color: var(--error);
        border-left: 5px solid var(--error);
    }

    .success {
        background: #1e2e1e;
        color: var(--success);
        border-left: 5px solid var(--success);
    }

    #status-panel div {
        margin: 0.5rem 0;
        font-size: 0.95rem;
        color: #ccc;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes floatUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 480px) {
        html, body {
            font-size: 16px;
        }

        form, #status-panel {
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 12px;
        }

        button {
            font-size: 1rem;
            padding: 0.8rem 1.2rem;
        }
    }
</style>
</head>
<body>
    <h1>Automated Account Creator</h1>
    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="message success">{{ success }}</div>
    {% endif %}
    <form method="post">
        <label>
            Base Username:
            <input type="text" name="base_username" required>
        </label>
        <label>
            Password:
            <input type="password" name="password" required>
        </label>
        <label>
            Number of Accounts:
            <input type="number" name="count" min="1" required>
        </label>
        <label>
            Custom Phone (10 digits, optional):
            <input type="text" name="phone" pattern="\d{10}">
        </label>
        <button type="submit">Start Creation</button>
    </form>

    <div id="status-panel">
        <h2>Live Status</h2>
        <div>Total to create: <span id="total">0</span></div>
        <div>Created: <span id="created">0</span></div>
        <div>Success: <span id="success">0</span></div>
        <div>Failure: <span id="failure">0</span></div>
        <div>Running: <span id="running">false</span></div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('total').textContent = data.total;
                document.getElementById('created').textContent = data.created;
                document.getElementById('success').textContent = data.success;
                document.getElementById('failure').textContent = data.failure;
                document.getElementById('running').textContent = data.running;
            } catch (e) {
                console.error('Failed to fetch status:', e);
            }
        }
        setInterval(fetchStatus, 2000);  // Poll every 2 seconds
        window.onload = fetchStatus;
    </script>
</body>
</html>
